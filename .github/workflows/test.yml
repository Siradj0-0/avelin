name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest ci.test_run_unit_tests -v
      - run: python -m ci.run_unit_tests
      - run: python -m compileall -q avelin
  gtk-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 xvfb
      - run: xvfb-run -a /usr/bin/python3 -m tests.gui_smoke
